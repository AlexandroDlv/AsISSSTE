<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro de Derechohabiente</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/registro.css' %}">
</head>
<body>

    <div class="form-container">
        <h2>Registro de Derechohabiente</h2>
        <form method="POST">
            {% csrf_token %}
            
            <label>Nombre:</label>
            <input type="text" name="nombre" required>

            <label>Apellido:</label>
            <input type="text" name="apellido" required>

            <label>Edad:</label>
            <input type="number" name="edad" required>

            <label>CURP:</label>
            <input type="text" name="curp" required>

            <label>Teléfono:</label>
            <input type="text" name="telefono" required>

            <label>Teléfono en caso de emergencia:</label>
            <input type="text" name="telefono_emergencia" required>

            <label>Correo electrónico:</label>
            <input type="email" name="correo" required>

            <label>Género:</label>
            <select name="genero" required>
                <option value="">Selecciona...</option>
                <option value="Hombre">Hombre</option>
                <option value="Mujer">Mujer</option>
            </select>

            <div id="contenedor-actividades">
                <div class="actividad-horario">
                    <label>Actividad:</label>
                    <select name="actividad" class="actividad-select" required onchange="actualizarHorarios(this)">
                        <option value="">Selecciona una actividad</option>
                        {% for act in actividades %}
                            <option value="{{ act.nombre }}">{{ act.nombre }}</option>
                        {% endfor %}
                    </select>

                    <label>Horario:</label>
                    <select name="horario" class="horario-select" required>
                        <option value="">Selecciona un horario</option>
                    </select>
                </div>
            </div>

            <button type="button" onclick="agregarActividad()">Agregar otra actividad</button>

            <button type="submit">Registrar</button>
        </form>
        <a href="{% url 'vista_personas' %}" class="btn-regresar">← Regresar</a>
    </div>

    <script>
        const actividades = {{ actividades|safe }};

        function actualizarHorarios(selectActividad) {
            const contenedor = selectActividad.closest('.actividad-horario');
            const selectHorario = contenedor.querySelector('.horario-select');
            const actividadSeleccionada = selectActividad.value;

            selectHorario.innerHTML = '<option value="">Selecciona un horario</option>';

            if (!actividadSeleccionada) return;

            const actividad = actividades.find(act => act.nombre === actividadSeleccionada);

            if (actividad && actividad.horarios) {
                actividad.horarios.forEach(horario => {
                    const option = document.createElement('option');
                    option.value = horario;
                    option.textContent = horario;
                    selectHorario.appendChild(option);
                });
            }
        }

        function agregarActividad() {
            const contenedor = document.getElementById('contenedor-actividades');
            const divNuevo = document.createElement('div');
            divNuevo.classList.add('actividad-horario');

            divNuevo.innerHTML = `
                <label>Actividad:</label>
                <select name="actividad" class="actividad-select" required onchange="actualizarHorarios(this)">
                    <option value="">Selecciona una actividad</option>
                    {% for act in actividades %}
                        <option value="{{ act.nombre }}">{{ act.nombre }}</option>
                    {% endfor %}
                </select>

                <label>Horario:</label>
                <select name="horario" class="horario-select" required>
                    <option value="">Selecciona un horario</option>
                </select>

                <button type="button" onclick="this.parentElement.remove()">Eliminar</button>
            `;

            contenedor.appendChild(divNuevo);
        }
    </script>

</body>
</html>
